plugins {
//    id 'org.springframework.boot'
    id 'application'
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id("io.spring.dependency-management") version "1.1.7"
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

ext{
    lombokVersion = "1.18.30"
}

dependencies {
    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is used by the application.
    implementation libs.guava
    implementation "org.springframework.cloud:spring-cloud-starter-bootstrap:5.0.1"
    implementation "org.springframework.boot:spring-boot-starter-web:4.0.6"
    implementation "org.springframework.boot:spring-boot-starter-actuator:4.0.6"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa:4.0.6"
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-security:4.0.6'
    implementation 'org.modelmapper:modelmapper:3.2.6'
    implementation 'mysql:mysql-connector-java:8.0.33'
    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testImplementation "org.projectlombok:lombok:$lombokVersion"
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.5'
    implementation 'org.springframework.boot:spring-boot-starter'
//    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.springframework.boot:spring-boot-starter-kafka:4.0.6'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.authservice.App'
}
