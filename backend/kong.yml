_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:9898
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false

  - name: user-service
    url: http://user-service:9810
    routes:
      - name: user-route
        paths:
          - /user
        strip_path: false