services:
  mysql:
    image: mysql:8.0
    container_name: mysql-expensetracker
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: springuser
      MYSQL_PASSWORD: springboot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microservice-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper-expensetracker
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - microservice-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-expensetracker
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      # KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - microservice-network

  user-service:
    build: ./userservice
    container_name: user-service-expensetracker
    restart: on-failure
    ports:
      - "9810:9810"
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DB: userservice
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - microservice-network

  auth-service:
    build: ./AuthService
    container_name: auth-service-expensetracker
    restart: on-failure
    ports:
      - "9898:9898"
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DB: authservice
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - microservice-network
    
  expense-service:
    build: ./expense-service
    container_name: expense-service-expensetracker
    restart: on-failure
    ports:
      - "9820:9820"
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DB: expenseservice
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - microservice-network
  ds-service:
    build: ./ds-service
    container_name: ds-service-expensetracker
    ports:
      - "8010:8010"
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    depends_on:
      - kafka
      - mysql
      - expense-service
      - user-service
    networks:
      - microservice-network
  kong:
    build:
      context: ./kong
      dockerfile: Dockerfile
    container_name: kong
    depends_on:
      - auth-service
      - user-service
      - expense-service
      - ds-service
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PLUGINS: "bundled,custom-auth"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml
      - ./kong/plugins/custom-auth:/usr/local/share/lua/5.1/kong/plugins/custom-auth
    networks:
      - microservice-network
volumes:
  mysql_data:

networks:
  microservice-network:
    driver: bridge
